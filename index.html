<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BALKIZ Light</title><style>
:root{color-scheme:light;--bg:#f3f4f9;--panel:rgba(255,255,255,.72);--line:#201b3818;--text:#171522;--muted:#716c7d;--soft:#ecebf3;--brand:linear-gradient(135deg,#977fff,#7053f3 50%,#25c3de);--shadow:0 18px 60px #2e27551c}[data-theme=dark]{color-scheme:dark;--bg:#0d0c13;--panel:#1c1925d9;--line:#ffffff18;--text:#f6f2fb;--muted:#aaa4b5;--soft:#282431;--shadow:0 20px 65px #0006}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}.app{height:100dvh;padding:12px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.side{border-radius:26px;padding:18px 14px;display:flex;flex-direction:column;min-height:0;transition:.25s}.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}.logo{width:39px;height:39px;filter:drop-shadow(0 7px 13px #7557ff44)}.brand b{font-size:19px;letter-spacing:-.04em}.brand i,h1 i{font-style:normal;font-weight:270;color:var(--muted)}.new{border:0;border-radius:15px;background:var(--brand);color:#fff;font-weight:700;padding:12px;cursor:pointer}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:20px 9px 7px}.history{overflow:auto;flex:1}.history-item{display:flex;gap:5px;align-items:center;padding:9px 8px 9px 11px;border-radius:12px;color:var(--muted);cursor:pointer}.history-item:hover,.history-item.active{background:var(--soft);color:var(--text)}.history-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.del,.foot button,.menu{border:0;background:transparent;color:inherit;cursor:pointer}.del{padding:3px 7px}.foot{border-top:1px solid var(--line);padding-top:9px}.foot button{width:100%;text-align:left;padding:8px;border-radius:10px;color:var(--muted)}.foot button:hover{background:var(--soft);color:var(--text)}
.main{min-width:0;min-height:0;display:grid;grid-template-rows:62px minmax(0,1fr) auto;position:relative}.top{border-radius:21px;display:flex;align-items:center;gap:11px;padding:0 14px}.menu{font-size:19px;width:36px;height:36px;border-radius:11px}.menu:hover{background:var(--soft)}.title{font-weight:650;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{font-size:12px;color:var(--muted)}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-right:8px}.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.thread{max-width:820px;min-height:100%;margin:auto;padding:34px 22px 42px;display:flex;flex-direction:column;gap:24px}.welcome{margin:auto;text-align:center;max-width:630px}.welcome .logo{width:82px;height:82px}.welcome h1{font-size:34px;letter-spacing:-.05em;margin:12px 0 4px}.welcome p{color:var(--muted);margin:0 auto 23px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:16px;padding:13px;cursor:pointer}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card b{display:block;color:var(--text)}
.msg{display:grid;grid-template-columns:31px minmax(0,1fr);gap:11px;animation:enter .25s ease}.msg.user{display:flex;justify-content:flex-end}.avatar{width:30px;height:30px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:800}.content{min-width:0;max-width:100%}.user .content{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:18px 18px 5px 18px;padding:10px 15px;max-width:78%}.content p{margin:0 0 11px}.content p:last-child{margin:0}.content h1,.content h2,.content h3{line-height:1.3;margin:20px 0 7px}.content h1{font-size:22px}.content h2{font-size:19px}.content h3{font-size:16px}.content pre{overflow:auto;background:#17151f;color:#eeeaf7;border-radius:15px;padding:16px}.content code{font:13px/1.55 ui-monospace,monospace;background:var(--soft);padding:2px 5px;border-radius:5px}.content pre code{background:none;padding:0}.content a{color:#7557ff}.cursor{display:inline-block;width:2px;height:1em;background:#7557ff;animation:blink .8s infinite}.thinking{color:var(--muted)}.thinking:before{content:"";display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:#7557ff;border-radius:50%;margin-right:9px;vertical-align:-2px;animation:spin .8s linear infinite}
.compose-region{padding:12px 20px max(18px,env(safe-area-inset-bottom))}.compose-wrap{max-width:820px;margin:auto}.compose{display:flex;align-items:flex-end;gap:8px;border-radius:23px;padding:8px 8px 8px 17px}.compose:focus-within{border-color:#7557ff70;box-shadow:0 0 0 4px #7557ff18,var(--shadow)}textarea{flex:1;min-height:42px;max-height:180px;padding:10px 0;border:0;outline:0;resize:none;background:transparent;color:var(--text)}.send{width:42px;height:42px;border:0;border-radius:50%;background:var(--brand);color:#fff;font-size:19px;cursor:pointer}.send:disabled{opacity:.3}.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}.jump{position:absolute;right:24px;bottom:110px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:8px 12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.jump.show{opacity:1;pointer-events:auto}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);padding:7px 12px;border-radius:99px;background:var(--text);color:var(--bg);opacity:0;transition:.2s}.toast.show{opacity:1}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(7px)}}
@media(max-width:800px){.app{display:block;padding:8px}.side{position:fixed;z-index:5;inset:8px auto 8px 8px;width:min(290px,calc(100vw - 28px));transform:translateX(calc(-100% - 20px))}.side.open{transform:none}.main{height:calc(100dvh - 16px);grid-template-rows:56px minmax(0,1fr) auto}.thread{padding:26px 12px}.cards{grid-template-columns:1fr}.status{font-size:0}.compose-region{padding-left:8px;padding-right:8px}.user .content{max-width:88%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><div class="app"><aside class="side glass" id="side"><div class="brand"><svg class="logo" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b83ff"/><stop offset="1" stop-color="#25c3de"/></linearGradient></defs><path fill="url(#g)" d="M50 5c23 1 43 21 44 44 1 25-20 44-44 46C26 97 6 77 6 53 5 29 27 4 50 5Z"/><path fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="5" stroke-linecap="round" d="M29 55c7-16 14-24 21-24s14 8 21 24M34 65c11 7 21 7 32 0"/></svg><b>BALKIZ <i>Light</i></b></div><button class="new" id="new">＋ Yeni sohbet</button><div class="label">Sohbetler</div><div class="history" id="history"></div><div class="foot"><button id="theme">◐ Görünümü değiştir</button><button id="export">↓ Sohbetleri dışa aktar</button><button id="clear">⌫ Geçmişi temizle</button></div></aside><main class="main"><header class="top glass"><button class="menu" id="menu">☰</button><div class="title" id="title">Yeni sohbet</div><div class="status" id="status">BALKIZ hazır</div></header><section class="scroll" id="scroll"><div class="thread" id="thread"></div></section><button class="jump" id="jump">↓ Yeni yanıta git</button><footer class="compose-region"><div class="compose-wrap"><div class="compose glass"><textarea id="input" rows="1" maxlength="16000" placeholder="BALKIZ’a bir şey sor…"></textarea><button class="send" id="send" disabled>↑</button></div><div class="hint"><span id="saved">Bu cihazda otomatik kaydedilir</span> · BALKIZ hata yapabilir.</div></div></footer></main></div><div class="toast" id="toast"></div>
<script>(()=>{'use strict';const $=s=>document.querySelector(s),KEY='balkiz_chats_v2',THEME='balkiz_theme_v2',e={side:$('#side'),history:$('#history'),thread:$('#thread'),scroll:$('#scroll'),input:$('#input'),send:$('#send'),title:$('#title'),status:$('#status'),jump:$('#jump'),saved:$('#saved'),toast:$('#toast')};let chats={},active='',streaming=false,sticky=true,timer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function md(src){const blocks=[];let s=String(src||'').replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(_,l,c)=>{blocks.push(`<pre><code>${esc(c.trim())}</code></pre>`);return `\0${blocks.length-1}\0`});s=esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');let out='',list='';for(const line of s.split('\n')){let m;if(m=line.match(/^\s*[-*]\s+(.+)/)){if(list!=='ul'){if(list)out+=`</${list}>`;out+='<ul>';list='ul'}out+=`<li>${m[1]}</li>`}else if(m=line.match(/^\s*\d+[.)]\s+(.+)/)){if(list!=='ol'){if(list)out+=`</${list}>`;out+='<ol>';list='ol'}out+=`<li>${m[1]}</li>`}else{if(list){out+=`</${list}>`;list=''}if(m=line.match(/^(#{1,3})\s+(.+)/))out+=`<h${m[1].length}>${m[2]}</h${m[1].length}>`;else if(line.trim())out+=`<p>${line}</p>`}}if(list)out+=`</${list}>`;return out.replace(/\0(\d+)\0/g,(_,i)=>blocks[+i])}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('balkiz_chats_v1')||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}catch{return{}}}function save(){clearTimeout(timer);e.saved.textContent='Kaydediliyor…';timer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(chats));e.saved.textContent='Kaydedildi ✓'}catch{e.saved.textContent='Kayıt alanı dolu'}},100)}function id(){return crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}function create(){const x=id();chats[x]={id:x,title:'Yeni sohbet',updatedAt:Date.now(),messages:[]};active=x;save();render();e.input.focus()}
function hist(){e.history.innerHTML='';Object.values(chats).sort((a,b)=>b.updatedAt-a.updatedAt).forEach(c=>{const r=document.createElement('div');r.className='history-item'+(c.id===active?' active':'');r.innerHTML=`<span>${esc(c.title||'Yeni sohbet')}</span><button class="del">×</button>`;r.onclick=x=>{if(x.target.closest('button'))return;active=c.id;render();e.side.classList.remove('open')};r.querySelector('button').onclick=()=>{delete chats[c.id];active=Object.keys(chats)[0]||'';save();active?render():create()};e.history.append(r)})}function welcome(){e.thread.innerHTML=`<div class="welcome"><svg class="logo" viewBox="0 0 100 100"><path fill="url(#g)" d="M50 5c23 1 43 21 44 44 1 25-20 44-44 46C26 97 6 77 6 53 5 29 27 4 50 5Z"/></svg><h1>BALKIZ <i>Light</i></h1><p>Birlikte düşünelim. Sorunu yaz; ben netleştireyim ve işe yarar bir yanıta dönüştüreyim.</p><div class="cards"><button class="card" data-q="Bu fikri uygulanabilir bir plana dönüştür"><b>✦ Planla</b>Bir fikri adımlara ayır</button><button class="card" data-q="Bu metni daha doğal ve etkileyici düzenle"><b>✎ Düzenle</b>Bir metni iyileştir</button><button class="card" data-q="Bu konuyu basit bir örnekle öğret"><b>◉ Öğren</b>Karmaşık konuyu sadeleştir</button><button class="card" data-q="Bu kodu incele, hatayı bul ve düzelt"><b>⌘ Kodla</b>Bir sorunu birlikte çöz</button></div></div>`;e.thread.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{e.input.value=b.dataset.q;grow();e.input.focus()})}function add(role,text){const a=document.createElement('article');a.className='msg '+role;a.innerHTML=role==='assistant'?`<div class="avatar">B</div><div class="content">${md(text)}</div>`:`<div class="content">${esc(text)}</div>`;e.thread.append(a);return a.querySelector('.content')}function render(){hist();const c=chats[active];e.title.textContent=c?.title||'Yeni sohbet';e.thread.innerHTML='';if(!c?.messages?.length)welcome();else c.messages.forEach(m=>add(m.role,m.content));requestAnimationFrame(()=>bottom(false))}function near(){return e.scroll.scrollHeight-e.scroll.scrollTop-e.scroll.clientHeight<100}function bottom(s=true){e.scroll.scrollTo({top:e.scroll.scrollHeight,behavior:s?'smooth':'auto'})}e.scroll.onscroll=()=>{sticky=near();e.jump.classList.toggle('show',!sticky)};e.jump.onclick=()=>{sticky=true;bottom()};function grow(){e.input.style.height='auto';e.input.style.height=Math.min(e.input.scrollHeight,180)+'px';e.send.disabled=!e.input.value.trim()||streaming}e.input.oninput=grow;e.input.onkeydown=x=>{if(x.key==='Enter'&&!x.shiftKey&&!x.isComposing){x.preventDefault();send()}};e.send.onclick=send;
async function ask(messages,update){const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});if(!r.ok){let x={};try{x=await r.json()}catch{}throw Error(x.error||`Sunucu hatası (${r.status})`)}if(!r.body)throw Error('Yanıt akışı başlatılamadı');const reader=r.body.getReader(),dec=new TextDecoder();let buf='',full='';while(true){const z=await reader.read();buf+=dec.decode(z.value||new Uint8Array(),{stream:!z.done});const events=buf.split('\n\n');buf=events.pop()||'';for(const ev of events)for(const line of ev.split('\n'))if(line.startsWith('data:')){let d;try{d=JSON.parse(line.slice(5))}catch{continue}if(d.error)throw Error(d.error);if(d.delta){full+=d.delta;update(full)}if(d.done)return full}if(z.done)return full}}
async function send(){const text=e.input.value.trim();if(!text||streaming)return;const c=chats[active];if(e.thread.querySelector('.welcome'))e.thread.innerHTML='';c.messages.push({role:'user',content:text});if(c.messages.length===1)c.title=text.replace(/\s+/g,' ').slice(0,46)+(text.length>46?'…':'');c.updatedAt=Date.now();save();hist();e.title.textContent=c.title;add('user',text);e.input.value='';grow();sticky=true;bottom();streaming=true;e.status.textContent='BALKIZ düşünüyor…';e.send.disabled=true;const box=add('assistant','');box.innerHTML='<div class="thinking">Yanıt hazırlanıyor</div>';let raf,pending='';try{const full=await ask(c.messages,p=>{pending=p;if(!raf)raf=requestAnimationFrame(()=>{box.innerHTML=md(pending)+'<i class="cursor"></i>';raf=0;if(sticky)bottom(false)})});box.innerHTML=md(full);c.messages.push({role:'assistant',content:full});c.updatedAt=Date.now();save();hist()}catch(x){box.innerHTML=`<p><strong>Yanıt alınamadı.</strong> ${esc(x.message)}</p>`}finally{streaming=false;e.status.textContent='BALKIZ hazır';grow();if(sticky)bottom()}}
$('#new').onclick=create;$('#menu').onclick=()=>e.side.classList.toggle('open');$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';localStorage.setItem(THEME,d?'light':'dark')};$('#clear').onclick=()=>{if(confirm('Tüm sohbetler silinsin mi?')){chats={};create()}};$('#export').onclick=()=>{const b=new Blob([JSON.stringify(chats,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='balkiz-sohbetler.json';a.click();URL.revokeObjectURL(a.href)};document.documentElement.dataset.theme=localStorage.getItem(THEME)==='dark'?'dark':'';chats=load();active=Object.values(chats).sort((a,b)=>b.updatedAt-a.updatedAt)[0]?.id||'';active?render():create();grow()})();</script></body></html>
